<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 05 - APIs e Assincronismo</title>

    <style>
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        section {
            margin-bottom: 32px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 8px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        input,
        button {
            padding: 10px;
            font-size: 1rem;
        }

        .estado {
            min-height: 24px;
            margin-top: 16px;
            font-weight: bold;
        }

        .erro {
            color: #b91c1c;
        }

        .sucesso {
            color: #15803d;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 8px 16px;
            margin-top: 16px;
        }

        dt {
            font-weight: bold;
        }

        #historico-ceps li {
            margin-bottom: 4px;
        }

        #dados-pokemon img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>Semana 05: Objetos, Dados e Assincronismo</h1>

    <section aria-labelledby="titulo-cep">
        <h2 id="titulo-cep">Buscador de CEP</h2>

        <form id="formulario-cep">
            <label for="campo-cep">Informe o CEP:</label>
            <input
                type="text"
                id="campo-cep"
                placeholder="Exemplo: 01001000"
                maxlength="9"
                autocomplete="postal-code"
            >
            <button type="submit" id="botao-cep">Buscar CEP</button>
        </form>

        <div id="estado-cep" class="estado" aria-live="polite"></div>
        <dl id="dados-cep"></dl>

        <h3>Histórico de CEPs pesquisados</h3>
        <ul id="historico-ceps"></ul>
    </section>

    <section aria-labelledby="titulo-pokemon">
        <h2 id="titulo-pokemon">Desafio Mini Pokédex</h2>

        <form id="formulario-pokemon">
            <label for="campo-pokemon">Nome do Pokémon:</label>
            <input
                type="text"
                id="campo-pokemon"
                placeholder="Exemplo: pikachu"
                autocomplete="off"
            >
            <button type="submit" id="botao-pokemon">Buscar Pokémon</button>
        </form>

        <div id="estado-pokemon" class="estado" aria-live="polite"></div>
        <div id="dados-pokemon"></div>
    </section>

    <script src="app.js" defer></script>
</body>
</html>
